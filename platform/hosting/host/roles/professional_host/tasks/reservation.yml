---
- name: Read the previous temporary identity within this lifecycle
  ansible.builtin.set_fact:
    professional_host_previous_identity: "{{ professional_host_previous_run.get('professional_host', {}).get(professional_host_scope) | default({}, true) }}"

- name: Refuse overlap, completed run reuse and deadline extension
  ansible.builtin.assert:
    that:
      - professional_host_previous_run | length == 0 or professional_host_previous_identity | length > 0
      - professional_host_previous_run | length == 0 or professional_host_previous_identity == professional_host_run or (professional_host_cleanup_record.resources_absent | default(false) and professional_host_cleanup_record.run_id | default('') == professional_host_previous_identity.run_id)
      - not (professional_host_cleanup_record.resources_absent | default(false) and professional_host_cleanup_record.run_id | default('') == professional_host_run.run_id)
    fail_msg: Finish cleanup before another run; never reuse a completed run or extend its fixed deadline.
    quiet: true

- name: Preserve the three-run provider campaign limit
  ansible.builtin.assert:
    that:
      - professional_host_run.run_id in professional_host_campaign or professional_host_campaign | length < 3
      - professional_host_run.run_id not in professional_host_campaign or professional_host_previous_identity == professional_host_run
    fail_msg: The provider campaign allows three runs. Recovery needs its own scope and spending approval.
    quiet: true
  when: professional_host_scope == 'qualification'

- name: Preserve immutable run ownership on rearming
  ansible.builtin.assert:
    that:
      - professional_host_previous_run.professional_host.project_id == professional_host.project_id
      - professional_host_previous_run.professional_host.ssh_public_key == professional_host.ssh_public_key
    quiet: true
  when: professional_host_previous_identity == professional_host_run
