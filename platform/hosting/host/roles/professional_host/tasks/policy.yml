---
- name: Require a bounded reviewed host configuration
  ansible.builtin.assert:
    that:
      - professional_host is mapping
      - professional_host.project_id is match('^[a-f0-9]{32}$|^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$')
      - professional_host.quote.hourly_eur_with_tax | float > 0
      - professional_host.quote.monthly_eur_with_tax | float > 0
      - professional_host.quote.monthly_eur_with_tax | float <= 100
      - professional_host.qualification is none or professional_host.qualification is mapping
      - professional_host.recovery | default(none) is none or professional_host.recovery is mapping
      - professional_host.recovery | default(none) is none or professional_host.qualification is none
      - ansible_verbosity < 3
    quiet: true

- name: Select the temporary lifecycle without changing the provider campaign
  ansible.builtin.set_fact:
    professional_host_run: "{{ professional_host.recovery | default(none) or professional_host.qualification }}"
    professional_host_scope: "{{ 'recovery' if professional_host.recovery | default(none) is not none else 'qualification' }}"

- name: Require an exact disposable run identity and bounded cost
  ansible.builtin.assert:
    that:
      - professional_host_run.run_id is match('^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$')
      - professional_host_run.expires_at is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
      - professional_host.quote.hourly_eur_with_tax | float * 3 <= 0.60
    fail_msg: Use a unique disposable run and reserve three billed hours within the separately approved EUR 0.60 allowance. Recovery is outside the closed provider campaign.
    quiet: true
  when: professional_host_run is not none

- name: Derive the resource name and exact ownership marker
  ansible.builtin.set_fact:
    professional_host_name: "{{ 'engineering-office' if professional_host_run is none else 'engineering-office-' + ('restore-' if professional_host_scope == 'recovery' else 'q-') + professional_host_run.run_id }}"
    professional_host_ownership: >-
      {{ {'owner': 'engineering-office', 'managed_by': 'opentofu',
          'purpose': 'professional-host' if professional_host_run is none else professional_host_scope}
          | combine(professional_host_run | default({}, true)) }}
    professional_host_state_key: "{{ 'recovery/' + professional_host_run.run_id + '/professional-host.tfstate' if professional_host_scope == 'recovery' else 'professional-host.tfstate' }}"
    professional_host_expiry_unit: "engineering-office-{{ professional_host_scope }}-expiry"
    professional_host_writer_unit: "{{ 'engineering-office-recovery-provisioning' if professional_host_scope == 'recovery' else 'engineering-office-provisioning' }}"
