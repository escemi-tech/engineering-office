command:
  hermes-retains-session:
    exec: |
      # Arrange: the original conversation was created before restart or restore.
      cd /opt/engineering-office
      # Act: read history without submitting another inference request.
      bash platform/assistant/tests/runtime/helpers/compose.sh exec -T hermes sh -c '
        curl --fail --silent --max-time 10 \
          -H "Authorization: Bearer $API_SERVER_KEY" \
          http://127.0.0.1:8642/api/sessions/engineering-office-smoke/messages
      '
      # Assert: both original messages must be present.
    exit-status: 0
    stdout:
      - "Prepare a synthetic briefing."
      - "Synthetic briefing: no connected sources."
  hermes-loads-policy-in-new-session:
    exec: |
      # Arrange: use a fresh session to avoid relying on cached conversation context.
      cd /opt/engineering-office
      # Repeat the authenticated probe after the runtime lifecycle transition.
      # jscpd:ignore-start
      # Act
      bash platform/assistant/tests/runtime/helpers/compose.sh exec -T hermes sh -c '
        curl --fail --silent --max-time 90 \
          -H "Authorization: Bearer $API_SERVER_KEY" \
          -H "X-Hermes-Session-Id: policy-$(cat /proc/sys/kernel/random/uuid)" \
          -H "Content-Type: application/json" \
          --data-binary @- http://127.0.0.1:8642/v1/chat/completions
      ' <<'JSON'
      {"messages":[{"role":"user","content":"Review this synthetic draft."}],"stream":false}
      JSON
      # jscpd:ignore-end
      # Assert: the inference fixture requires the complete compiled system policy.
    timeout: 100000
    exit-status: 0
    stdout:
      - "Synthetic briefing: no connected sources."
      - '"finish_reason": "stop"'
