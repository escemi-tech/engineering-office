services:
  hermes:
    depends_on:
      - inference
  inference:
    image: ${HERMES_TEST_IMAGE:?Use the image selected by the deployment compose file}
    entrypoint: [node, /fixtures/inference.mjs]
    user: "10000:10000"
    read_only: true
    volumes:
      - ../tests/runtime/fixtures/inference.mjs:/fixtures/inference.mjs:ro
      - type: bind
        source: ../../../.build/hermes/AGENTS.md
        target: /fixtures/AGENTS.md
        read_only: true
        bind:
          create_host_path: false
      - ../../../features/writing/policy/.apm/instructions/writing.instructions.md:/fixtures/writing.instructions.md:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  default:
    internal: true
