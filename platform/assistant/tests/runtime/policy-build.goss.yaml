command:
  hermes-policy-build-preserves-authored-instructions:
    exec: |
      bash /opt/engineering-office/platform/assistant/tests/runtime/helpers/policy-project.sh <<'SH'
      # Arrange
      sha256sum AGENTS.md > authored.sha256
      # Act: cover a clean build and replacement of a read-only artifact.
      make hermes-policy
      make hermes-policy
      # Assert
      test -s .build/hermes/AGENTS.md
      test "$(stat -c %a .build/hermes/AGENTS.md)" = 444
      sha256sum --check authored.sha256
      SH
    timeout: 60000
    exit-status: 0
    stdout:
      - "AGENTS.md: OK"
  hermes-start-rejects-unqualified-compiler:
    exec: |
      bash /opt/engineering-office/platform/assistant/tests/runtime/helpers/policy-project.sh <<'SH'
      # Arrange
      sha256sum AGENTS.md > authored.sha256
      apm() { printf '%s\n' 'unqualified compiler'; }
      docker() { touch "$POLICY_PROJECT/unexpected-docker-call"; }
      export -f apm docker
      # Act
      if make hermes-start > build.log 2>&1; then
        cat build.log
        exit 1
      fi
      # Assert: Docker and authored files must remain untouched.
      cat build.log
      test ! -e unexpected-docker-call
      test ! -e .build/hermes/AGENTS.md
      sha256sum --check authored.sha256
      SH
    timeout: 10000
    exit-status: 0
    stdout:
      - "before building the Hermes writing policy."
      - "AGENTS.md: OK"
  hermes-start-rejects-failed-or-empty-compilation:
    exec: |
      bash /opt/engineering-office/platform/assistant/tests/runtime/helpers/policy-project.sh <<'SH'
      # Arrange: a prepared artifact cannot bypass a failed build.
      install -d .build/hermes
      printf '%s\n' 'Previously prepared synthetic policy.' > .build/hermes/AGENTS.md
      chmod 0444 .build/hermes/AGENTS.md
      sha256sum AGENTS.md .build/hermes/AGENTS.md > preserved.sha256
      apm() {
        if [[ "$1" == --version ]]; then
          command apm "$@"
        else
          printf 'Synthetic compiler outcome: %s\n' "$BUILD_FAILURE"
          if [[ "$BUILD_FAILURE" == empty ]]; then
            touch AGENTS.md
          else
            return 1
          fi
        fi
      }
      docker() { touch "$POLICY_PROJECT/unexpected-docker-call"; }
      export -f apm docker
      for BUILD_FAILURE in error empty; do
        export BUILD_FAILURE
        # Act
        if make hermes-start > build.log 2>&1; then
          cat build.log
          exit 1
        fi
        # Assert: preserve both files and never start with the old artifact.
        cat build.log
        test ! -e unexpected-docker-call
        sha256sum --check preserved.sha256
      done
      SH
    timeout: 30000
    exit-status: 0
    stdout:
      - "Synthetic compiler outcome: error"
      - "Synthetic compiler outcome: empty"
      - ".build/hermes/AGENTS.md: OK"
