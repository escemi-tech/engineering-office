---
- name: Verify the existing runtime before granting client access
  ansible.builtin.include_role:
    name: hermes
    tasks_from: health

- name: Check that the briefing cleanup timer is active
  ansible.builtin.command:
    argv:
      [
        systemctl,
        is-active,
        "hermes-briefing-cleanup-{{ hermes_project_name }}.timer",
      ]
  changed_when: false

- name: Inspect the admitted source before granting client access
  community.docker.docker_container_info:
    name: "{{ hermes_project_name }}-briefing-source-1"
  register: hermes_briefing_access_source
  no_log: true

- name: Require a healthy source connector
  ansible.builtin.assert:
    that:
      - hermes_briefing_access_source.exists
      - hermes_briefing_access_source.container.State.Health.Status == 'healthy'
    quiet: true
  no_log: true

- name: Read the existing gateway credential without exposing it
  ansible.builtin.slurp:
    src: /srv/engineering-office/.local/hermes-gateway-key
  register: hermes_briefing_access_gateway
  no_log: true

- name: Require separate tunnel control-plane access
  ansible.builtin.assert:
    that:
      - hermes_briefing_access_config.runtime_key != hermes_briefing_access_gateway.content | b64decode | trim
    quiet: true
  no_log: true

- name: Create the private client access directory
  ansible.builtin.file:
    path: /srv/engineering-office/.local/briefing-client
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Deliver separate protected gateway and tunnel credentials
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "/srv/engineering-office/.local/briefing-client/{{ item.name }}"
    owner: "1000"
    group: "1000"
    mode: "0600"
  loop:
    - name: key
      value: "{{ hermes_briefing_access_gateway.content | b64decode }}"
    - name: tunnel-key
      value: "{{ hermes_briefing_access_config.runtime_key }}"
  no_log: true
  diff: false
  register: hermes_briefing_access_client_credentials

- name: Deliver the fixed native tunnel profile
  ansible.builtin.template:
    src: tunnel.yaml.j2
    dest: /srv/engineering-office/.local/briefing-client/tunnel.yaml
    owner: "1000"
    group: "1000"
    mode: "0600"
  register: hermes_briefing_access_client_profile

- name: Create the owned client service directory
  ansible.builtin.file:
    path: /srv/engineering-office/services/hermes/briefing-client
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deliver the isolated client service
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../../platform/assistant/runtime/briefing-client/compose.yml"
    dest: /srv/engineering-office/services/hermes/briefing-client/compose.yml
    owner: root
    group: root
    mode: "0444"

- name: Converge only the approved client service
  environment:
    HERMES_PROJECT: "{{ hermes_project_name }}"
  community.docker.docker_compose_v2:
    project_src: /srv/engineering-office/services/hermes/briefing-client
    project_name: "{{ hermes_project_name }}-client"
    files: [compose.yml]
    state: present
    build: always
    recreate: >-
      {{ 'always' if hermes_briefing_access_client_credentials.changed or
         hermes_briefing_access_client_profile.changed else 'auto' }}
    wait: true
    wait_timeout: 180
  no_log: true
