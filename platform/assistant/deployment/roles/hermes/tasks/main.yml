---
- name: Require exclusive deployment maintenance
  ansible.builtin.include_tasks: "{{ role_path }}/../../../backup/helpers/hermes-backup-idle.yml"

- name: Validate deployment inputs before changing the host
  block:
    - name: Validate the explicit runtime credential allowlist
      ansible.builtin.assert:
        that:
          - hermes_project_name is match('^[a-z0-9][a-z0-9_-]+$')
          - hermes_runtime is defined
          - hermes_runtime is mapping
          - hermes_runtime.keys() | sort == ['gateway_api_key', 'inference_api_key', 'inference_url', 'model']
          - hermes_runtime.values() | select('string') | list | length == 4
          - hermes_runtime.values() | select('search', '[\x00-\x1f\x7f]') | list | length == 0
          - hermes_runtime.gateway_api_key | length >= 32
          - hermes_runtime.inference_api_key | trim | length > 0
          - hermes_runtime.model | trim | length > 0
          - hermes_runtime.gateway_api_key != hermes_runtime.inference_api_key
          - hermes_runtime.inference_url | urlsplit('hostname') | default('', true) | length > 0
          - >-
            hermes_runtime.inference_url | urlsplit('scheme') == 'https' or
            (hermes_runtime.inference_url | urlsplit('scheme') == 'http' and
            hermes_runtime.inference_url | urlsplit('hostname') in ['localhost', '127.0.0.1', '::1'])
          - not hermes_runtime.inference_url | urlsplit('username')
          - not hermes_runtime.inference_url | urlsplit('password')
          - not hermes_runtime.inference_url | urlsplit('query')
          - not hermes_runtime.inference_url | urlsplit('fragment')
          - hermes_runtime.inference_url | urlsplit('path') is search('/v1$')
        quiet: true
      no_log: true
  rescue:
    - name: Reject invalid Hermes deployment inputs
      ansible.builtin.fail:
        msg: >-
          Supply exactly model, inference_url, inference_api_key and gateway_api_key
          in hermes_runtime. Use nonempty single-line strings, a distinct gateway key
          of at least 32 characters, and an HTTPS endpoint ending in /v1 without
          embedded credentials, query or fragment. HTTP is allowed only on loopback.
          See docs/usage/hermes-deployment.md.

- name: Require a compiled writing policy on the controller
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.file', role_path ~ '/../../../../../.build/hermes/AGENTS.md') | length > 0
    fail_msg: Run make hermes-policy on the controller before deployment.
    quiet: true

- name: Validate optional briefing access before changing the host
  ansible.builtin.include_tasks: briefing-validate.yml

- name: Remove source-derived conversations before disabling an existing capability
  ansible.builtin.include_tasks: briefing-disable.yml
  when: hermes_briefing | length == 0

- name: Create deployment directories owned by the operator
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /srv/engineering-office
    - /srv/engineering-office/services
    - /srv/engineering-office/services/hermes
    - /srv/engineering-office/.build
    - /srv/engineering-office/.build/hermes

- name: Restrict the runtime credential directory
  ansible.builtin.file:
    path: /srv/engineering-office/.local
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deliver only the runtime settings in a protected file
  ansible.builtin.template:
    src: runtime-credentials.j2
    dest: /srv/engineering-office/.local/hermes.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Deliver the reviewed runtime
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../../{{ item.source }}"
    dest: "/srv/engineering-office/{{ item.destination }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - source: platform/assistant/runtime/compose.yml
      destination: services/hermes/compose.yml
  register: hermes_assets

- name: Deliver the minimum approved runtime capabilities
  ansible.builtin.copy:
    content: >-
      {{ (lookup('ansible.builtin.file', role_path ~ '/../../../../../platform/assistant/runtime/config.yaml') | from_yaml)
         | combine((lookup('ansible.builtin.file', role_path ~ '/../../../../../platform/assistant/runtime/briefing/config.yaml') | from_yaml)
                   if hermes_briefing | length > 0 else {}, recursive=true) | to_nice_yaml }}
    dest: /srv/engineering-office/services/hermes/config.yaml
    owner: root
    group: root
    mode: "0444"
  register: hermes_config

- name: Deliver canonical writing instructions and the enabled feature policy
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', role_path ~ '/../../../../../.build/hermes/AGENTS.md') }}
      {{ lookup('ansible.builtin.file', role_path ~ '/../../../../../features/briefing/instructions.md') if hermes_briefing | length > 0 else '' }}
    dest: /srv/engineering-office/.build/hermes/AGENTS.md
    owner: root
    group: root
    mode: "0444"
  register: hermes_policy

- name: Deliver the isolated briefing capability when explicitly configured
  ansible.builtin.include_tasks: briefing.yml
  when: hermes_briefing | length > 0

- name: Deliver the independent shutdown command
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../../Makefile"
    dest: /srv/engineering-office/Makefile
    owner: root
    group: root
    mode: "0444"

- name: Inspect the restart policy before deployment
  community.docker.docker_container_info:
    docker_host: unix:///var/run/docker.sock
    name: "{{ hermes_project_name }}-hermes-1"
  no_log: true
  register: hermes_existing_container

- name: Converge Hermes with only its own credentials
  environment:
    HERMES_POLICY_FILE: /srv/engineering-office/.build/hermes/AGENTS.md
    HERMES_BRIEFING_DIRECTORY: /srv/engineering-office/.local/briefing
  community.docker.docker_compose_v2:
    docker_host: unix:///var/run/docker.sock
    project_src: /srv/engineering-office/services/hermes
    project_name: "{{ hermes_project_name }}"
    files: "{{ ['compose.yml', 'briefing/compose.yml'] if hermes_briefing | length > 0 else ['compose.yml'] }}"
    env_files: [/srv/engineering-office/.local/hermes.env]
    state: present
    remove_orphans: true
    # Compose's config hash does not track docker update --restart=no from hermes-stop.
    recreate: >-
      {{ 'always' if hermes_assets.changed or hermes_config.changed or hermes_policy.changed or
         (hermes_briefing_proxy.changed | default(false)) or
         (hermes_existing_container.exists and
          hermes_existing_container.container.HostConfig.RestartPolicy.Name != 'unless-stopped')
         else 'auto' }}
    wait: true
    wait_timeout: 180
  no_log: true
  register: hermes_deployment

- name: Converge briefing cleanup only after runtime health succeeds
  ansible.builtin.include_tasks: briefing-cleanup.yml
