---
name: Test - Professional host provisioning

on:
  workflow_call:

permissions: {}

jobs:
  test-professional-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Arrange: isolated synthetic inputs, no cloud credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the disposable runner's native user service manager
        env:
          FIXTURE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$FIXTURE_RUNNER_ENVIRONMENT" = github-hosted
          runner_uid="$(id -u)"
          sudo loginctl enable-linger "$runner_uid"
          sudo systemctl start "user@$runner_uid.service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' \
            "$runner_uid" "$runner_uid" >> "$GITHUB_ENV"
      - name: Prepare the synthetic encryption key
        id: fixture
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            await io.mkdirP('.local');
            const directory = fs.mkdtempSync(path.join(process.env.GITHUB_WORKSPACE, '.local/host-test-'));
            const key = path.join(directory, 'key');
            fs.writeFileSync(key, 'synthetic-professional-host-test-password', { mode: 0o600 });
            core.setOutput('directory', directory);
            core.setOutput('key', key);
      # Act / Assert: native tests own configuration and failure assertions.
      - name: Test the host plan and its rejected configurations
        uses: hoverkraft-tech/ci-github-iac/actions/opentofu/test@f8c074d2d45a37caa4a24e2dcdf6d2df034a2ae1 # 1.3.0
        env:
          TF_VAR_state_password_file: ${{ steps.fixture.outputs.key }}
        with:
          working-directory: tofu/professional-host
          tofu-version-file: tofu/.opentofu-version
          comment: "false"
          report-name: engineering-office - Professional host plans
      - name: Test campaign guards and the native controller lifecycle
        # These shared action inputs deliberately match the state scenario.
        # jscpd:ignore-start
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@f8c074d2d45a37caa4a24e2dcdf6d2df034a2ae1 # 1.3.0
        env:
          FIXTURE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        with:
          ansible-requirements: ansible/requirements.txt
          python-version-file: ansible/.python-version
          ansible-config: tests/ansible/ansible.cfg
          galaxy-requirements: ansible/collections/requirements.yml
          # jscpd:ignore-end
          test-playbook: tests/ansible/professional-host.yml
          comment: "false"
          report-name: engineering-office - Professional host safety
      - name: Remove the synthetic key
        if: ${{ always() && steps.fixture.outputs.directory != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FIXTURE_DIRECTORY: ${{ steps.fixture.outputs.directory }}
        with:
          script: await io.rmRF(process.env.FIXTURE_DIRECTORY);
