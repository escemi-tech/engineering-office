---
name: Test - Hermes deployment

on:
  workflow_call:

permissions: {}

jobs:
  test-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Arrange
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read qualified compiler version
        id: apm
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            core.setOutput('version', (await readFile('services/hermes/.apm-version', 'utf8')).trim());
      - name: Set up qualified APM compiler
        id: compiler
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: true
          apm-version: ${{ steps.apm.outputs.version }}
      - name: Set up the Ansible controller Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ansible/.python-version
      - name: Create a fresh Ubuntu host
        id: vm
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm-config: tests/lima.yml
      # Act and Assert: install prerequisites through the production playbook.
      - name: Test host preparation and convergence
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        env: &vm-connection
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        with:
          ansible-requirements: ansible/requirements.txt
          ansible-config: tests/ansible/ansible.cfg
          test-playbook: tests/ansible/hermes-host.yml
          report-name: engineering-office - Hermes host preparation
      - name: Verify Docker host prerequisites
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/host.goss.yaml
          report-name: engineering-office - Hermes host prerequisites
      # Arrange
      - name: Copy deployment, compiler and synthetic fixtures
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
          APM_PATH: ${{ steps.compiler.outputs.apm-path }}
        run: |
          # Fresh sessions pick up the Docker group granted by the test fixture.
          tar -czf - Makefile AGENTS.md services/hermes tests/hermes packages/writing-policy | \
            ssh -o ControlMaster=no -o ControlPath=none -F "$VM_SSH_CONFIG" "$VM_NAME" 'tar -xzf - -C /opt/engineering-office'
          # The released compiler needs its adjacent runtime files.
          tar -czf - -C "$(dirname "$APM_PATH")" . | \
            ssh -o ControlMaster=no -o ControlPath=none -F "$VM_SSH_CONFIG" "$VM_NAME" 'mkdir -p /opt/engineering-office/.cache/apm && tar -xzf - -C /opt/engineering-office/.cache/apm'
      # Act and Assert: each Goss scenario owns its arrangements and assertions.
      - name: Verify policy build and failure boundaries
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/policy-build.goss.yaml
          report-name: engineering-office - Hermes policy build
      # Act
      - name: Build the deployment writing policy
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: |
          make hermes-policy
          ssh -o ControlMaster=no -o ControlPath=none -F "$VM_SSH_CONFIG" "$VM_NAME" 'cd /opt/engineering-office && PATH="$PWD/.cache/apm:$PATH" make hermes-policy'
      # Assert
      - name: Verify deployment preflight
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/preflight.goss.yaml
          report-name: engineering-office - Hermes preflight
      # Act
      - name: Start Hermes with isolated synthetic inference
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: ssh -o ControlMaster=no -o ControlPath=none -F "$VM_SSH_CONFIG" "$VM_NAME" 'cd /opt/engineering-office && bash tests/hermes/helpers/compose.sh up -d --wait --wait-timeout 180'
      # Assert
      - name: Verify startup, authentication and synthetic conversation
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/goss.yaml
          report-name: engineering-office - Hermes startup
      # Act
      - name: Restart Hermes
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: |
          ssh -o ControlMaster=no -o ControlPath=none -F "$VM_SSH_CONFIG" "$VM_NAME" 'cd /opt/engineering-office &&
            bash tests/hermes/helpers/compose.sh restart hermes &&
            bash tests/hermes/helpers/compose.sh up -d --wait --wait-timeout 180'
      # Assert
      - name: Verify session after restart
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/recovery.goss.yaml
          report-name: engineering-office - Hermes restart
      # Act
      - name: Restore a stopped backup into a new volume
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: ssh -o ControlMaster=no -o ControlPath=none -F "$VM_SSH_CONFIG" "$VM_NAME" 'bash /opt/engineering-office/tests/hermes/restore.sh'
      # Assert
      - name: Verify session after restore
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/recovery.goss.yaml
          report-name: engineering-office - Hermes restore
      - name: Verify independent shutdown and gateway key rotation
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/revocation.goss.yaml
          report-name: engineering-office - Hermes revocation
      # Arrange: release the demo's port and disposable state before host deployment.
      - name: Remove the completed synthetic demo
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: ssh -o ControlMaster=no -o ControlPath=none -F "$VM_SSH_CONFIG" "$VM_NAME" 'cd /opt/engineering-office && bash tests/hermes/helpers/compose.sh down --volumes'
      # Act and Assert: native Ansible checks preflight and convergence.
      - name: Test scoped host deployment
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        env:
          VM_SSH_CONFIG: ${{ steps.vm.outputs.ssh-config }}
          VM_NAME: ${{ steps.vm.outputs.name }}
          DEPLOYER_CANARY: synthetic-controller-credential-never-for-hermes
        with:
          ansible-requirements: ansible/requirements.txt
          galaxy-requirements: ansible/collections/requirements.yml
          ansible-config: tests/ansible/ansible.cfg
          test-playbook: tests/ansible/hermes.yml
          report-name: engineering-office - Hermes Ansible deployment
      # Assert: Goss checks the deployed service and filesystem boundaries.
      - name: Verify the deployed runtime and credential separation
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/deployment.goss.yaml
          report-name: engineering-office - Hermes deployed boundary
      # Act and Assert: inspect failures without exposing content or restarting the service.
      - name: Test operator gateway health diagnostics
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        env: *vm-connection
        with:
          test-playbook: tests/ansible/hermes-health.yml
          report-name: engineering-office - Hermes gateway health
          ansible-requirements: ansible/requirements.txt
          galaxy-requirements: ansible/collections/requirements.yml
          ansible-config: tests/ansible/ansible.cfg
      # Act and Assert: reboot without reapplying either production playbook.
      - name: Test automatic recovery after host reboot
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        env: *vm-connection
        with:
          ansible-requirements: ansible/requirements.txt
          ansible-config: tests/ansible/ansible.cfg
          test-playbook: tests/ansible/hermes-reboot.yml
          report-name: engineering-office - Hermes host reboot
      # Assert
      - name: Verify Docker after host reboot
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/host.goss.yaml
          report-name: engineering-office - Hermes host after reboot
      - name: Verify the saved session after host reboot
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: tests/hermes/session.goss.yaml
          report-name: engineering-office - Hermes session after host reboot
      # Act and Assert: retain an encrypted copy outside the source VM.
      - name: Test encrypted backup and retention before host loss
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        env: *vm-connection
        with:
          ansible-requirements: ansible/requirements.txt
          galaxy-requirements: ansible/collections/requirements.yml
          ansible-config: tests/ansible/ansible.cfg
          test-playbook: tests/ansible/hermes-backup.yml
          report-name: engineering-office - Hermes backup retention
      # Act: verify source removal before allocating the recovery host.
      - name: Destroy the original host and its disks
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
      # Arrange
      - name: Create a fresh recovery host
        id: recovery
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm-config: tests/lima.yml
      # Act and Assert: use the runner copy, an independent key and production playbooks.
      - name: Test recovery after complete host loss
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        env:
          VM_SSH_CONFIG: ${{ steps.recovery.outputs.ssh-config }}
          VM_NAME: ${{ steps.recovery.outputs.name }}
        with:
          ansible-requirements: ansible/requirements.txt
          galaxy-requirements: ansible/collections/requirements.yml
          ansible-config: tests/ansible/ansible.cfg
          test-playbook: tests/ansible/hermes-recovery.yml
          report-name: engineering-office - Hermes host loss recovery
      # Assert
      - name: Verify recovered host prerequisites
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.recovery.outputs.vm }}
          goss-file: tests/hermes/host.goss.yaml
          report-name: engineering-office - Hermes recovery host
      - name: Verify original conversation and credential separation on the new host
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.recovery.outputs.vm }}
          goss-file: tests/hermes/backup.goss.yaml
          report-name: engineering-office - Hermes recovered conversation
      - name: Ensure the original host is removed
        if: ${{ always() && steps.vm.outputs.vm != '' }}
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
      - name: Destroy the recovery host and its restored state
        if: ${{ always() && steps.recovery.outputs.vm != '' }}
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@89e3bf93adc94b592188e714f61d4abc391aab46 # 1.0.0
        with:
          vm: ${{ steps.recovery.outputs.vm }}
      - name: Remove the runner recovery copy
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('node:path');
            await io.rmRF(path.join(process.env.RUNNER_TEMP, 'hermes-recovery'));
