---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    with:
      # Remove with the Makefile exclusion once zizmor accepts the APM ecosystem.
      # GitHub's native Dependabot configuration validation remains active.
      linter-env: |
        STRIP_DEFAULT_WORKSPACE_FOR_REGEX=true
        FILTER_REGEX_EXCLUDE=^\.github/dependabot\.yml$
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  test-hermes:
    uses: $/.github/workflows/test-hermes.yml
    permissions:
      contents: read
  test-writing-normalizer:
    uses: $/.github/workflows/test-writing-normalizer.yml
    permissions:
      contents: read
  test-github-briefing:
    uses: $/.github/workflows/test-github-briefing.yml
    permissions:
      contents: read

  reports:
    needs: [test-hermes, test-writing-normalizer, test-github-briefing]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@a9378a75e8d91af8f4cf3192cb74e68954259012 # Consolidated reports: ci-github-common PR 632
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
