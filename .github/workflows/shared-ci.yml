---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  ansible-targets:
    name: Ansible validation readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.targets.outputs.enabled }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Ansible targets when content exists
        id: targets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tracked = await exec.getExecOutput('git', ['ls-files', 'ansible/']);
            const files = tracked.stdout.trim().split('\n').filter(Boolean);
            core.setOutput('enabled', files.length > 0);
            if (!files.length) {
              core.setOutput('matrix', { include: [{ name: 'not-configured' }] });
              await core.summary.addRaw('Ansible checks were not run: this repository has no Ansible content yet.').write();
              return;
            }
            const playbooks = files.filter(file => /^ansible\/[^/]+\.ya?ml$/.test(file) && !/^ansible\/(inventory[./]|requirements\.)/.test(file));
            const collections = files.filter(file => /^ansible\/collections\/ansible_collections\/[^/]+\/[^/]+\/galaxy\.yml$/.test(file));
            const include = collections.map(file => ({ name: file.split('/').at(-2), collection: file.slice(0, -'/galaxy.yml'.length), playbooks: '' }));
            if (playbooks.length) include.unshift({ name: 'syntax', playbooks: playbooks.join('\n'), collection: '' });
            core.setOutput('matrix', { include });
            if (!include.length) core.setFailed('Ansible content exists but no playbook or collection was selected.');
  ansible:
    name: Ansible - ${{ matrix.name }}
    needs: [ansible-targets]
    if: needs.ansible-targets.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ansible-targets.outputs.matrix) }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Ansible
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@8c0133170818c92808c59e856dc4e6a17217d19e # feat/ansible-test-action
        with:
          ansible-requirements: ansible/requirements.txt
          playbooks: ${{ matrix.playbooks }}
          collection: ${{ matrix.collection }}
          report-name: engineering-office - Ansible - ${{ matrix.name }}
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create VM
        id: vm
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@70843368d5f5f7b0a2cec1e8435d81cc40beee64 # 0.1.0
        with:
          vm-config: tests/lima.yml
      - name: Execute guest assertions
        id: test
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@70843368d5f5f7b0a2cec1e8435d81cc40beee64 # 0.1.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          test-script: tests/e2e.sh
          report-name: engineering-office - VM tests
      - name: Destroy VM
        if: ${{ always() && steps.vm.outputs.vm != '' }}
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@70843368d5f5f7b0a2cec1e8435d81cc40beee64 # 0.1.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
  checks:
    if: ${{ always() }}
    needs: [linter, ansible-targets, ansible, vm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const passed = Object.entries(results).every(([name, job]) =>
              job.result === 'success' ||
              (name === 'ansible' && results['ansible-targets'].outputs.enabled === 'false' && job.result === 'skipped')
            );
            if (!passed) core.setFailed('A required check did not succeed');
