---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  ansible:
    name: Ansible validation readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Ansible targets when content exists
        id: ansible
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tracked = await exec.getExecOutput('git', ['ls-files', 'ansible/']);
            const files = tracked.stdout.trim().split('\n').filter(Boolean);
            core.setOutput('enabled', files.length > 0);
            if (!files.length) {
              await core.summary.addRaw('Ansible checks were not run: this repository has no Ansible content yet.').write();
              return;
            }
            const playbooks = files.filter(file => /^ansible\/[^/]+\.ya?ml$/.test(file) && !/^ansible\/inventory[./]/.test(file));
            const collections = files.filter(file => /^ansible\/collections\/ansible_collections\/[^/]+\/[^/]+\/galaxy\.yml$/.test(file));
            core.setOutput('playbooks', playbooks.join('\n'));
            core.setOutput('collections', collections.map(file => file.slice(0, -'/galaxy.yml'.length)).join('\n'));
            if (!playbooks.length && !collections.length) core.setFailed('Ansible content exists but no playbook or collection was selected.');
      - name: Build Ansible tooling
        if: steps.ansible.outputs.enabled == 'true'
        run: docker build --tag engineering-office-tooling:local --file docker/tooling/Dockerfile .
      - name: Test Ansible
        if: steps.ansible.outputs.enabled == 'true'
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@d2673efa2d13247d9a7ccf9fc2b6876fbf2d3435 # feat/ansible-test-action
        with:
          container-image: engineering-office-tooling:local
          playbooks: ${{ steps.ansible.outputs.playbooks }}
          collections: ${{ steps.ansible.outputs.collections }}
          report-name: engineering-office - Ansible tests
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create VM
        id: vm
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@70843368d5f5f7b0a2cec1e8435d81cc40beee64 # 0.1.0
        with:
          vm-config: tests/lima.yml
      - name: Execute guest assertions
        id: test
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@70843368d5f5f7b0a2cec1e8435d81cc40beee64 # 0.1.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          test-script: tests/e2e.sh
          report-name: engineering-office - VM tests
      - name: Destroy VM
        if: ${{ always() && steps.vm.outputs.vm != '' }}
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@70843368d5f5f7b0a2cec1e8435d81cc40beee64 # 0.1.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
  checks:
    if: ${{ always() }}
    needs: [linter, ansible, vm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const results = Object.values(JSON.parse(process.env.RESULTS));
            if (!results.every(job => job.result === 'success')) core.setFailed('A required check did not succeed');
