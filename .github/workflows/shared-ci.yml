---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    with:
      comment: false
      # Remove with the Makefile exclusion once zizmor accepts the APM ecosystem.
      # GitHub's native Dependabot configuration validation remains active.
      linter-env: |
        STRIP_DEFAULT_WORKSPACE_FOR_REGEX=true
        FILTER_REGEX_EXCLUDE=^\.github/dependabot\.yml$
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  test-hermes:
    uses: $/.github/workflows/test-hermes.yml
    permissions:
      contents: read
  test-writing-normalizer:
    uses: $/.github/workflows/test-writing-normalizer.yml
    permissions:
      contents: read
  test-github-briefing:
    uses: $/.github/workflows/test-github-briefing.yml
    permissions:
      contents: read

  reports:
    needs: [lint, test-hermes, test-writing-normalizer, test-github-briefing]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
