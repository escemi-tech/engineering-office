---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
    with:
      comment: false
      # Remove with the Makefile exclusion once zizmor accepts the APM ecosystem.
      # GitHub's native Dependabot configuration validation remains active.
      linter-env: |
        ANSIBLE_DIRECTORY=platform
        ANSIBLE_HOME=/github/home/.ansible
        STRIP_DEFAULT_WORKSPACE_FOR_REGEX=true
        FILTER_REGEX_EXCLUDE=^\.github/dependabot\.yml$
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  test-hermes:
    uses: $/.github/workflows/test-hermes.yml
    permissions:
      contents: read
  test-writing-normalizer:
    uses: $/.github/workflows/test-writing-normalizer.yml
    permissions:
      contents: read
  test-github-briefing:
    uses: $/.github/workflows/test-github-briefing.yml
    permissions:
      contents: read
  test-hermes-briefing:
    uses: $/.github/workflows/test-hermes-briefing.yml
    permissions:
      contents: read
  test-infrastructure-state:
    uses: $/.github/workflows/test-infrastructure-state.yml
    permissions:
      contents: read

  test-management:
    uses: $/.github/workflows/test-management.yml
    permissions:
      contents: read

  test-professional-host:
    uses: $/.github/workflows/test-professional-host.yml
    permissions:
      contents: read

  reports:
    needs:
      [
        lint,
        test-hermes,
        test-writing-normalizer,
        test-github-briefing,
        test-hermes-briefing,
        test-infrastructure-state,
        test-management,
        test-professional-host,
      ]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
