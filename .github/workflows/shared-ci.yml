---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    with:
      # Remove with the Makefile exclusion once zizmor accepts the APM ecosystem.
      # GitHub's native Dependabot configuration validation remains active.
      linter-env: |
        STRIP_DEFAULT_WORKSPACE_FOR_REGEX=true
        FILTER_REGEX_EXCLUDE=^\.github/dependabot\.yml$
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  test-hermes:
    uses: $/.github/workflows/test-hermes.yml
    permissions:
      contents: read
      pull-requests: write
  test-writing-normalizer:
    uses: $/.github/workflows/test-writing-normalizer.yml
    permissions:
      contents: read
      pull-requests: write
