---
name: Test - Writing normalizer

on:
  workflow_call:

permissions: {}

jobs:
  test-writing-normalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Act and Assert: the package suite owns the preservation assertions.
      - name: Test normalization and publish reports
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
        with:
          working-directory: features/writing/normalizer
          report-file: |
            .reports/junit.xml
            .reports/lcov.info
          comment: "false"
