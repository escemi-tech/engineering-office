---
name: Test - Recoverable infrastructure state

on:
  workflow_call:

permissions: {}

jobs:
  test-infrastructure-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Arrange
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare native OpenTofu recovery tests
        id: native
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            await io.mkdirP('.local');
            const root = fs.mkdtempSync(path.join(process.env.GITHUB_WORKSPACE, '.local/native-tofu-'));
            fs.mkdirSync(path.join(root, 'module'), { mode: 0o700 });
            for (const source of ['platform/hosting/host/tofu/state.tofu', 'platform/hosting/state/tests/contract.tofu', 'platform/hosting/state/tests/native.tofutest.hcl'])
              fs.copyFileSync(source, path.join(root, 'module', path.basename(source)));
            fs.writeFileSync(path.join(root, 'key'), 'synthetic-independent-native-state-test-password', { mode: 0o600 });
            core.setOutput('directory', path.relative(process.env.GITHUB_WORKSPACE, root));
            core.setOutput('key', path.join(root, 'key'));
      - name: Test native OpenTofu configuration
        uses: hoverkraft-tech/ci-github-iac/actions/opentofu/test@f8c074d2d45a37caa4a24e2dcdf6d2df034a2ae1 # 1.3.0
        env:
          TF_VAR_state_password_file: ${{ steps.native.outputs.key }}
        with:
          working-directory: ${{ steps.native.outputs.directory }}/module
          tofu-version-file: tooling/opentofu/.opentofu-version
          comment: "false"
          report-name: engineering-office - Native OpenTofu
      - name: Check native OpenTofu formatting
        run: tofu fmt -check -recursive platform/hosting/host/tofu platform/hosting/state/tests
      - name: Start isolated independent storage
        run: |
          docker compose -p infrastructure-state-fixture -f platform/hosting/state/tests/compose.yml up -d --wait storage
          docker compose -p infrastructure-state-fixture -f platform/hosting/state/tests/compose.yml run --rm audit
      # Act and Assert: assertions use real native encryption, S3 and concurrent writers.
      - name: Test state bootstrap, locking and recovery
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@f8c074d2d45a37caa4a24e2dcdf6d2df034a2ae1 # 1.3.0
        with:
          ansible-requirements: tooling/ansible/requirements.txt
          python-version-file: tooling/ansible/.python-version
          ansible-config: tooling/ansible/ansible.cfg
          galaxy-requirements: tooling/ansible/collections/requirements.yml
          test-playbook: platform/hosting/state/tests/ansible/infrastructure-state.yml
          comment: "false"
          report-name: engineering-office - Infrastructure state
      - name: Remove isolated storage and every fixture object version
        if: always()
        run: docker compose -p infrastructure-state-fixture -f platform/hosting/state/tests/compose.yml down --volumes
      - name: Remove disposable native state and key files
        if: ${{ always() && steps.native.outputs.directory != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FIXTURE_DIRECTORY: ${{ steps.native.outputs.directory }}
        with:
          script: await io.rmRF(process.env.FIXTURE_DIRECTORY);
