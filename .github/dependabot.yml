version: 2
updates:
  - package-ecosystem: pip
    commit-message:
      prefix: build
    directory: /tooling/ansible
    groups:
      pip-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    commit-message:
      prefix: build
    directories:
      - /features/writing/normalizer
      - /features/briefing/github
    groups:
      npm-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    commit-message:
      prefix: build
    directory: /
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    commit-message:
      prefix: build
    directory: /
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    commit-message:
      prefix: build
    directories:
      - "**/*"
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: apm
    commit-message:
      prefix: build
    directory: /features/writing/policy
    groups:
      apm-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
