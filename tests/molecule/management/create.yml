---
# Arrange: the only targets are containers owned by this native Molecule scenario.
- name: Create isolated administration targets
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require a disposable GitHub-hosted runner
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'GITHUB_ACTIONS') == 'true'
          - lookup('ansible.builtin.env', 'FIXTURE_RUNNER_ENVIRONMENT') == 'github-hosted'
        fail_msg: Run privileged network fixtures only through the dedicated hosted workflow.
        quiet: true
    - name: Install the pinned controller dependencies in the action's isolated environment
      ansible.builtin.pip:
        requirements: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/ansible/requirements.txt"
        executable: "{{ ansible_playbook_python | dirname }}/pip"
    - name: Protect fixture material
      ansible.builtin.file:
        path: "{{ fixture_directory }}"
        state: directory
        mode: "0700"
    - name: Create an ephemeral SSH identity
      ansible.builtin.command:
        argv:
          [
            ssh-keygen,
            -q,
            -t,
            ed25519,
            -N,
            "",
            -f,
            "{{ fixture_directory }}/ssh-key",
          ]
        creates: "{{ fixture_directory }}/ssh-key"
      no_log: true
    - name: Start the isolated systemd host, operator and neighbour
      community.docker.docker_compose_v2:
        project_src: "{{ fixture_compose }}"
        project_name: management-fixture
        wait: true
    - name: Read the bootstrap network address
      community.docker.docker_container_info:
        name: management-fixture-server
      register: fixture_server
    - name: Write the initial SSH transport
      ansible.builtin.copy:
        dest: "{{ fixture_directory }}/ssh.config"
        mode: "0600"
        content: |
          Host management-server
            HostName {{ fixture_server.container.NetworkSettings.Networks['management-fixture_default'].IPAddress }}
            User root
            IdentityFile {{ fixture_directory }}/ssh-key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
    - name: Retain only the fixture bootstrap address
      ansible.builtin.copy:
        dest: "{{ fixture_directory }}/bootstrap-address"
        content: "{{ fixture_server.container.NetworkSettings.Networks['management-fixture_default'].IPAddress }}"
        mode: "0600"

- name: Prepare the synthetic SSH endpoint
  hosts: server-console
  gather_facts: false
  tasks:
    - name: Install the fixture SSH server
      ansible.builtin.apt:
        name: [openssh-server, netcat-openbsd, iproute2]
        update_cache: true
        cache_valid_time: 3600
        install_recommends: false
    - name: Protect the synthetic root identity directory
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"
    - name: Admit only the fixture SSH public key
      ansible.builtin.copy:
        src: "{{ fixture_directory }}/ssh-key.pub"
        dest: /root/.ssh/authorized_keys
        mode: "0600"
    - name: Start and enable the fixture SSH service
      ansible.builtin.systemd_service:
        name: ssh.service
        state: started
        enabled: true
    - name: Enable forwarding to prove the firewall blocks lateral traffic
      ansible.builtin.command:
        argv: [sysctl, -w, net.ipv4.ip_forward=1]
      changed_when: true

- name: Prepare the independent operator identity
  hosts: operator-console
  gather_facts: false
  tasks:
    - name: Install native WireGuard client tools
      ansible.builtin.apt:
        name: [wireguard-tools, netcat-openbsd, iproute2, curl]
        update_cache: true
        cache_valid_time: 3600
        install_recommends: false
    - name: Protect the operator keys
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"
    - name: Generate native ephemeral operator keys
      ansible.builtin.shell: |
        umask 077
        wg genkey > /etc/wireguard/operator.key
        wg genkey > /etc/wireguard/unapproved.key
        wg pubkey < /etc/wireguard/operator.key
      args:
        executable: /bin/bash
      changed_when: true
      no_log: true
      register: fixture_operator_key
    - name: Share only the public operator identity with the controller
      ansible.builtin.copy:
        dest: "{{ fixture_directory }}/operator.pub"
        content: "{{ fixture_operator_key.stdout }}"
        mode: "0600"
      delegate_to: localhost
