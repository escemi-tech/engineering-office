command:
  hermes-stop-without-deployment:
    exec: |
      bash -euo pipefail <<'SH'
      # Arrange: no deployment configuration, credentials or compiler are available.
      project=$(mktemp -d)
      trap 'rm -rf "$project"' EXIT
      cp /opt/engineering-office/Makefile "$project/"
      # Act: stopping a project with no container is safe to repeat.
      make -C "$project" HERMES_PROJECT=engineering-office-hermes-test-absent hermes-stop
      # Assert: Goss requires the explicit absence result, not a Docker failure.
      SH
    timeout: 10000
    exit-status: 0
    stdout:
      - "No Hermes containers found for engineering-office-hermes-test-absent."
  hermes-stop-reports-unavailable-docker:
    exec: |
      bash -euo pipefail <<'SH'
      # Arrange: the selected Docker socket does not exist.
      cd /opt/engineering-office
      project=$(mktemp -d)
      trap 'rm -rf "$project"' EXIT
      # Act
      if env -u DOCKER_CONTEXT DOCKER_HOST="unix://$project/missing.sock" \
        make HERMES_PROJECT=engineering-office-hermes-test hermes-stop > "$project/stop.log" 2>&1; then
        exit 1
      fi
      # Assert: never claim a successful stop when container discovery failed.
      if grep -Eq 'Hermes stopped|No Hermes containers found' "$project/stop.log"; then
        exit 1
      fi
      printf '%s\n' 'Unavailable Docker fails shutdown explicitly.'
      SH
    timeout: 10000
    exit-status: 0
    stdout:
      - "Unavailable Docker fails shutdown explicitly."
  hermes-independent-stop-and-key-rotation:
    exec: |
      bash -euo pipefail <<'SH'
      # Arrange: retain the restored session and a container outside the project.
      cd /opt/engineering-office
      project=$(mktemp -d)
      unrelated=''
      trap 'if [[ -n "$unrelated" ]]; then docker container rm --force "$unrelated" >/dev/null; fi; rm -rf "$project"' EXIT
      cp Makefile "$project/"
      hermes=$(bash tests/hermes/helpers/compose.sh ps --quiet hermes)
      inference=$(bash tests/hermes/helpers/compose.sh ps --quiet inference)
      original_key=$(docker exec "$hermes" printenv API_SERVER_KEY)
      replacement_key=synthetic-rotated-gateway-key-for-tests-only
      # Split template delimiters so Goss leaves Docker's format expressions intact.
      image=$(docker container inspect --format '{''{.Config.Image}}' "$hermes")
      unrelated=$(docker run --detach --network none --restart unless-stopped \
        --label com.docker.compose.project=engineering-office-hermes-test-unrelated \
        --label com.docker.compose.service=hermes \
        --entrypoint node "$image" -e 'setInterval(() => {}, 1000)')
      # Make the API unresponsive without relying on it to shut itself down.
      docker exec "$inference" curl --fail --silent --max-time 10 http://hermes:8642/health > /dev/null
      docker exec --user 10000:10000 "$hermes" pkill -STOP -f 'gateway run --replace'
      status=0
      docker exec "$inference" curl --silent --max-time 2 http://hermes:8642/health > /dev/null || status=$?
      test "$status" = 28
      # Act: only the Makefile and Docker are available to the operator.
      make -C "$project" HERMES_PROJECT=engineering-office-hermes-test hermes-stop
      make -C "$project" HERMES_PROJECT=engineering-office-hermes-test hermes-stop
      # Assert: stop is repeatable, scoped and preserves evidence and state.
      test "$(docker container inspect --format '{''{.State.Running}} {''{.HostConfig.RestartPolicy.Name}}' "$hermes")" = 'false no'
      test "$(docker container inspect --format '{''{.State.Running}}' "$inference")" = true
      test "$(docker container inspect --format '{''{.State.Running}} {''{.HostConfig.RestartPolicy.Name}}' "$unrelated")" = 'true unless-stopped'
      docker container logs "$hermes" > "$project/hermes.log" 2>&1
      test -s "$project/hermes.log"
      docker volume inspect engineering-office-hermes-test_state > /dev/null
      # Arrange: change only the gateway credential using a synthetic override.
      cat > "$project/rotation.yml" <<YAML
      services:
        hermes:
          environment:
            API_SERVER_KEY: $replacement_key
      YAML
      # Act: recreation loads the replacement key and restores normal supervision.
      bash tests/hermes/helpers/compose.sh -f "$project/rotation.yml" \
        up -d --force-recreate --no-deps --wait --wait-timeout 180 hermes < /dev/null
      # Assert: the old key fails and the new key reads the original conversation.
      status=$(docker exec "$inference" curl --silent --show-error --max-time 10 --output /dev/null \
        --write-out '%{http_code}' \
        -H "Authorization: Bearer $original_key" \
        http://hermes:8642/api/sessions)
      test "$status" = 401
      replacement=$(bash tests/hermes/helpers/compose.sh ps --quiet hermes)
      test "$replacement" != "$hermes"
      test "$(docker container inspect --format '{''{.HostConfig.RestartPolicy.Name}}' "$replacement")" = unless-stopped
      docker exec "$inference" curl --fail --silent --show-error --max-time 10 \
        -H "Authorization: Bearer $replacement_key" \
        http://hermes:8642/api/sessions/engineering-office-smoke/messages
      printf '\n%s\n' 'Old gateway key rejected; replacement key accepted.'
      SH
    timeout: 300000
    exit-status: 0
    stdout:
      - "Hermes stopped; automatic restart disabled. Containers, logs and volumes retained."
      - "Prepare a synthetic briefing."
      - "Synthetic briefing: no connected sources."
      - "Old gateway key rejected; replacement key accepted."
