services:
  hermes:
    depends_on:
      - inference
    environment:
      TERMINAL_CWD: /opt/writing-policy
    volumes:
      - type: bind
        source: ../../.reports/hermes-writing-policy
        target: /opt/writing-policy
        read_only: true
        bind:
          create_host_path: false
  inference:
    image: ${HERMES_TEST_IMAGE:?Use the image selected by the deployment compose file}
    entrypoint: [node, /fixtures/inference.mjs]
    user: "10000:10000"
    read_only: true
    volumes:
      - ../../tests/hermes/fixtures/inference.mjs:/fixtures/inference.mjs:ro
      - type: bind
        source: ../../.reports/hermes-writing-policy/AGENTS.md
        target: /fixtures/AGENTS.md
        read_only: true
        bind:
          create_host_path: false
      - ../../packages/writing-policy/.apm/instructions/writing.instructions.md:/fixtures/writing.instructions.md:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  default:
    internal: true
