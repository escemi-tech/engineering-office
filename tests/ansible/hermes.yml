---
# Arrange
- name: Select the disposable VM supplied by shared CI
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require the test VM connection
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'VM_NAME') | length > 0
          - lookup('ansible.builtin.env', 'VM_SSH_CONFIG') | length > 0
          - lookup('ansible.builtin.env', 'DEPLOYER_CANARY') | length > 0
        quiet: true
    - name: Register the isolated Docker host
      ansible.builtin.add_host:
        name: "{{ lookup('ansible.builtin.env', 'VM_NAME') }}"
        groups: hermes
        ansible_ssh_common_args: "-o ControlMaster=no -o ControlPath=none -F {{ lookup('ansible.builtin.env', 'VM_SSH_CONFIG') | quote }}"
        ansible_python_interpreter: /usr/bin/python3
        hermes_project_name: engineering-office-hermes-test
        hermes_runtime:
          model: synthetic
          inference_url: http://127.0.0.1:8080/v1
          inference_api_key: synthetic-inference-key-for-tests-only # checkov:skip=CKV_SECRET_6:Public synthetic fixture credential
          gateway_api_key: "synthetic-gateway-key-for-tests-$'\"\\only"

    - name: Exercise rejected inputs through the public command
      block:
        - name: Create a temporary synthetic inventory
          ansible.builtin.tempfile:
            state: file
            suffix: .yml
          register: rejected_inventory
        - name: Write only the disposable SSH target
          ansible.builtin.copy:
            dest: "{{ rejected_inventory.path }}"
            mode: "0600"
            content: |
              hermes:
                hosts:
                  {{ lookup('ansible.builtin.env', 'VM_NAME') | to_json }}:
                    ansible_ssh_common_args: {{ hostvars[lookup('ansible.builtin.env', 'VM_NAME')].ansible_ssh_common_args | to_json }}
                    ansible_python_interpreter: /usr/bin/python3
        # Act: a subprocess keeps expected rejections out of the parent JUnit report.
        - name: Attempt deployment with missing or excess credentials
          ansible.builtin.command:
            argv:
              - env
              - -u
              - ANSIBLE_CALLBACKS_ENABLED
              - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
              - "{{ playbook_dir }}/../../ansible/hermes.yml"
              - -i
              - "{{ rejected_inventory.path }}"
              - --extra-vars
              - "{{ {'hermes_runtime': item} | to_json }}"
          loop:
            - {}
            - "{{ hostvars[lookup('ansible.builtin.env', 'VM_NAME')].hermes_runtime | combine({'vault_session': 'synthetic-forbidden-vault-session'}) }}"
          register: rejected_deployments
          changed_when: false
          failed_when: false
        # Assert
        - name: Require both inputs to fail at the credential preflight
          ansible.builtin.assert:
            that:
              - item.rc == 2
              - "'Reject invalid Hermes deployment inputs' in item.stdout"
              - "'Supply exactly model, inference_url, inference_api_key and gateway_api_key' in item.stdout"
            quiet: true
          loop: "{{ rejected_deployments.results }}"
          loop_control:
            label: rejected runtime mapping
      rescue:
        - name: Fail the rejected-input scenario
          ansible.builtin.fail:
            msg: The controller did not observe the expected credential preflight rejection.
      always:
        - name: Remove the temporary synthetic inventory
          ansible.builtin.file:
            path: "{{ rejected_inventory.path }}"
            state: absent
          when: rejected_inventory.path is defined

- name: Verify credential preflight leaves the host unchanged
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Inspect the deployment destination after rejection
      ansible.builtin.stat:
        path: /srv/engineering-office
      register: rejected_destination
    - name: Require preflight to leave the host unchanged
      ansible.builtin.assert:
        that:
          - not rejected_destination.stat.exists
        quiet: true

# Act: exercise the operator's real playbook with the synthetic inventory.
- name: Deploy through the public entrypoint
  ansible.builtin.import_playbook: ../../ansible/hermes.yml

- name: Verify convergence and prepare the runtime boundary scenario
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Require the first deployment to start Hermes
      ansible.builtin.assert:
        that:
          - hermes_deployment.changed
          - hermes_deployment.containers | length == 1
        quiet: true
    # Arrange
    - name: Record the running container identity
      ansible.builtin.set_fact:
        hermes_first_container: "{{ hermes_deployment.containers[0].ID }}"
    - name: Create an unrelated operator credential canary
      ansible.builtin.copy:
        dest: /etc/engineering-office-operator-only
        content: synthetic-operator-credential-never-for-hermes
        owner: root
        group: root
        mode: "0600"
    # Act
    - name: Repeat the same deployment
      ansible.builtin.include_role:
        name: hermes
    # Assert
    - name: Require unchanged assets and a running container without replacement
      ansible.builtin.assert:
        that:
          - not hermes_assets.changed
          - not hermes_deployment.changed
          - hermes_deployment.containers[0].ID == hermes_first_container
        quiet: true
    # Arrange: the fake model shares only the container network namespace.
    - name: Create the public inference fixture directory
      ansible.builtin.file:
        path: /opt/hermes-deployment-fixture
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Copy the public inference fixture and canonical policy
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "/opt/hermes-deployment-fixture/{{ item.name }}"
        owner: root
        group: root
        mode: "0444"
      loop:
        - source: ../hermes/fixtures/inference.mjs
          name: inference.mjs
        - source: ../../packages/writing-policy/.apm/instructions/writing.instructions.md
          name: writing.instructions.md
    - name: Start the local synthetic inference endpoint
      community.docker.docker_container:
        name: engineering-office-hermes-test-inference
        image: "{{ hermes_deployment.containers[0].Image }}"
        entrypoint: [node, /fixtures/inference.mjs]
        command: []
        network_mode: "container:{{ hermes_first_container }}"
        user: "10000:10000"
        read_only: true
        volumes:
          - /opt/hermes-deployment-fixture/inference.mjs:/fixtures/inference.mjs:ro
          - /opt/hermes-deployment-fixture/writing.instructions.md:/fixtures/writing.instructions.md:ro
          - /srv/engineering-office/.build/hermes/AGENTS.md:/fixtures/AGENTS.md:ro
        security_opts: [no-new-privileges:true]
        cap_drop: [ALL]
