---
# Arrange
- name: Select the disposable host
  ansible.builtin.import_playbook: helpers/inventory.yml

- name: Supply synthetic recovery settings
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Select the synthetic recovery settings
      ansible.builtin.include_tasks: helpers/recovery-settings.yml
    - name: Protect the runner handoff directory
      ansible.builtin.file:
        path: "{{ recovery_directory }}"
        state: directory
        mode: "0700"

- name: Prepare the synthetic repository and state canary
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    - name: Prepare the repository and independent fixture passwords
      ansible.builtin.include_tasks: helpers/recovery-material.yml
    - name: Initialize the isolated encrypted repository
      ansible.builtin.command:
        argv: [restic, --no-cache, init]
      environment:
        RESTIC_REPOSITORY: "{{ hermes_backup_repository }}"
        RESTIC_PASSWORD_FILE: "{{ hermes_backup_password_file }}"
      changed_when: true
      no_log: true
    - name: Inspect the source state volume
      community.docker.docker_volume_info:
        name: "{{ hermes_project_name }}_state"
      register: fixture_state_volume
    - name: Add a synthetic ownership and encryption canary
      ansible.builtin.copy:
        dest: "{{ fixture_state_volume.volume.Mountpoint }}/recovery-canary"
        content: synthetic-restic-plaintext-canary
        owner: "10000"
        group: "10000"
        mode: "0600"

- name: Verify backup admission failures
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Allocate the temporary test inventory
      ansible.builtin.tempfile:
        state: file
        suffix: .yml
      register: backup_test_inventory
    - name: Write the disposable recovery inventory
      ansible.builtin.copy:
        dest: "{{ backup_test_inventory.path }}"
        mode: "0600"
        content: |
          hermes:
            vars:
              hermes_project_name: engineering-office-hermes-test
              hermes_backup_repository: /var/lib/hermes-backup-test/repository
              hermes_backup_password_file: /var/lib/hermes-backup-test/password
            hosts:
              {{ lookup('ansible.builtin.env', 'VM_NAME') | to_json }}:
                ansible_ssh_common_args: {{ hostvars[lookup('ansible.builtin.env', 'VM_NAME')].ansible_ssh_common_args | to_json }}
                ansible_python_interpreter: /usr/bin/python3
    - name: Reject missing recovery keys and a live source
      ansible.builtin.include_tasks: helpers/expect-backup-rejection.yml
      vars:
        backup_rejection_cases:
          - playbook: hermes-backup
            variables:
              hermes_backup_password_file: /var/lib/hermes-backup-test/missing-password
            message: Resolve the existing recovery paths on the target
          - playbook: hermes-backup
            variables: {}
            message: Stop the selected deployment with make hermes-stop
          - playbook: hermes-backup-prune
            variables: {}
            message: Stop the selected deployment with make hermes-stop
          - playbook: hermes-backup-check
            variables: {}
            message: No matching Hermes recovery point exists
          - playbook: hermes-backup-check
            variables:
              hermes_project_name: absent-fixture
            message: Backup check requires the deployment's existing dedicated local state volume

- name: Enter the disposable maintenance window
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    - name: Stop Hermes with the production shutdown command
      ansible.builtin.command:
        argv:
          [
            make,
            -C,
            /srv/engineering-office,
            "HERMES_PROJECT={{ hermes_project_name }}",
            hermes-stop,
          ]
      changed_when: true

- name: Prepare sparse expired history and an unrelated backup
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Arrange: sparse history exposes age limits independently of snapshot counts.
    - name: Create old daily points
      ansible.builtin.include_tasks: helpers/retention-fixture.yml
      vars:
        retention_fixture_days: [60, 35]
    - name: Save the expired identities
      ansible.builtin.set_fact:
        expired_snapshots: >-
          {{ retention_fixture_snapshots.results | map(attribute='stdout_lines') |
             map('last') | map('from_json') | map(attribute='snapshot_id') | list }}
    - name: Create a differently tagged snapshot outside the retention scope
      ansible.builtin.command:
        argv:
          [
            restic,
            --no-cache,
            backup,
            --json,
            --host,
            "{{ hermes_project_name }}",
            --tag,
            unrelated-fixture,
            "{{ fixture_state_volume.volume.Mountpoint }}",
          ]
      environment:
        RESTIC_REPOSITORY: "{{ hermes_backup_repository }}"
        RESTIC_PASSWORD_FILE: "{{ hermes_backup_password_file }}"
      changed_when: true
      no_log: true
      register: unrelated_backup
    - name: Create an unrelated fixture path
      ansible.builtin.file:
        path: /var/lib/hermes-backup-test/unrelated-state
        state: directory
        mode: "0700"
    - name: Add fresh decoys for a different host or state path
      ansible.builtin.command:
        argv:
          - restic
          - --no-cache
          - backup
          - --json
          - --host
          - "{{ item.host }}"
          - --tag
          - engineering-office-hermes-state
          - "{{ item.path }}"
      environment:
        RESTIC_REPOSITORY: "{{ hermes_backup_repository }}"
        RESTIC_PASSWORD_FILE: "{{ hermes_backup_password_file }}"
      loop:
        - host: unrelated-host
          path: "{{ fixture_state_volume.volume.Mountpoint }}"
        - host: "{{ hermes_project_name }}"
          path: /var/lib/hermes-backup-test/unrelated-state
      changed_when: true
      no_log: true
      register: unrelated_check_snapshots

# Act and Assert: fresh snapshots from other scopes must not hide stale state.
- name: Verify stale-backup detection against the real encrypted repository
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Reject stale state despite fresh differently tagged, hosted or pathed snapshots
      ansible.builtin.include_tasks: helpers/expect-backup-rejection.yml
      vars:
        backup_rejection_cases:
          - playbook: hermes-backup-check
            variables: {}
            message: No matching recovery point is within 24 hours

# Act
- name: Create a verified replacement and expire sparse history
  ansible.builtin.import_playbook: ../../ansible/hermes-backup-prune.yml

- name: Verify age expiry and prepare daily and weekly history
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Require every expired recovery point to have been selected
      ansible.builtin.assert:
        that:
          - expired_snapshots | difference(hermes_backup_retention_remove) | length == 0
          - hermes_backup_snapshot not in hermes_backup_retention_remove
        quiet: true
    # Arrange
    - name: Create a dense daily history
      ansible.builtin.include_tasks: helpers/retention-fixture.yml
      vars:
        retention_fixture_days: "{{ range(1, 28) | list }}"
    - name: Record the six most recent historical days
      ansible.builtin.set_fact:
        recent_daily_snapshots: >-
          {{ retention_fixture_snapshots.results[:6] | map(attribute='stdout_lines') |
             map('last') | map('from_json') | map(attribute='snapshot_id') | list }}

# Act: repeat maintenance; the new snapshot replaces the previous same-day one.
- name: Enforce daily and weekly limits through the public entrypoint
  ansible.builtin.import_playbook: ../../ansible/hermes-backup-prune.yml

- name: Verify retained points and scope preservation
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Read the repository after actual deletion and data pruning
      ansible.builtin.command:
        argv: [restic, --no-cache, snapshots, --json]
      environment:
        RESTIC_REPOSITORY: "{{ hermes_backup_repository }}"
        RESTIC_PASSWORD_FILE: "{{ hermes_backup_password_file }}"
      changed_when: false
      no_log: true
      register: retained_snapshots
    - name: Require daily points, bounded weekly history and the unrelated snapshot
      ansible.builtin.assert:
        that:
          - kept_ids | length >= 8
          - kept_ids | length <= 12
          - hermes_backup_snapshot in kept_ids
          - recent_daily_snapshots | difference(kept_ids) | length == 0
          - expired_snapshots | intersect(kept_ids) | length == 0
          - hermes_backup_retention_remove | intersect(kept_ids) | length == 0
          - (unrelated_backup.stdout_lines[-1] | from_json).snapshot_id in kept_ids
          - unrelated_ids | difference(all_ids) | length == 0
        quiet: true
      vars:
        all_ids: "{{ retained_snapshots.stdout | from_json | map(attribute='id') | list }}"
        kept_ids: >-
          {{ retained_snapshots.stdout | from_json | selectattr('hostname', 'equalto', hermes_project_name) |
             selectattr('paths', 'equalto', [fixture_state_volume.volume.Mountpoint]) | map(attribute='id') | list }}
        unrelated_ids: >-
          {{ unrelated_check_snapshots.results | map(attribute='stdout_lines') |
             map('last') | map('from_json') | map(attribute='snapshot_id') | list }}
    # Arrange: a future timestamp must stop retention, not advance its clock.
    - name: Add a snapshot with an invalid future timestamp
      ansible.builtin.include_tasks: helpers/retention-fixture.yml
      vars:
        retention_fixture_days: [-1]
    - name: Record the future snapshot identity
      ansible.builtin.set_fact:
        future_snapshot: "{{ (retention_fixture_snapshots.results[0].stdout_lines[-1] | from_json).snapshot_id }}"

- name: Verify restore and key failure boundaries
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Reject wrong keys and existing state
      ansible.builtin.include_tasks: helpers/expect-backup-rejection.yml
      vars:
        backup_rejection_cases:
          - playbook: hermes-backup
            variables:
              hermes_backup_password_file: /var/lib/hermes-backup-test/wrong-password
            message: Authenticate and verify the encrypted repository
          - playbook: hermes-backup-prune
            variables:
              hermes_backup_password_file: /var/lib/hermes-backup-test/wrong-password
            message: Authenticate and verify the encrypted repository
          - playbook: hermes-backup-prune
            variables: {}
            message: Reject future timestamps
          - playbook: hermes-backup-check
            variables:
              hermes_backup_password_file: /var/lib/hermes-backup-test/wrong-password
            message: Authenticate and verify the encrypted repository
          - playbook: hermes-backup-check
            variables: {}
            message: A matching recovery point is in the future
          - playbook: hermes-restore
            variables:
              hermes_restore_snapshot: latest
            message: Supply the full reviewed Restic snapshot ID
          - playbook: hermes-restore
            variables:
              hermes_restore_snapshot: "{{ hostvars[lookup('ansible.builtin.env', 'VM_NAME')].hermes_backup_snapshot }}"
            message: Restore requires a new volume

- name: Preserve recovery material outside the disposable source host
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Read all snapshots after rejected maintenance
      ansible.builtin.command:
        argv: [restic, --no-cache, snapshots, --json]
      environment: &fixture-restic-environment
        RESTIC_REPOSITORY: "{{ hermes_backup_repository }}"
        RESTIC_PASSWORD_FILE: "{{ hermes_backup_password_file }}"
      changed_when: false
      no_log: true
      register: preserved_snapshots
    - name: Require rejected operations to preserve every existing recovery point
      ansible.builtin.assert:
        that:
          - (retained_snapshots.stdout | from_json | map(attribute='id') | list) | difference(preserved_ids) | length == 0
          - future_snapshot in preserved_ids
        quiet: true
      vars:
        preserved_ids: "{{ preserved_snapshots.stdout | from_json | map(attribute='id') | list }}"
    - name: Inspect the source after rejected recovery operations
      community.docker.docker_container_info:
        name: "{{ hermes_project_name }}-hermes-1"
      register: preserved_source
    - name: Require the original source to remain stopped and present
      ansible.builtin.assert:
        that:
          - preserved_source.exists
          - not preserved_source.container.State.Running
        quiet: true
    # Arrange: only after verified backup and refusal-to-overwrite checks.
    - name: Remove only the deliberate future-timestamp fixture
      ansible.builtin.command:
        argv: [restic, --no-cache, forget, "{{ future_snapshot }}"]
      environment: *fixture-restic-environment
      changed_when: true
      no_log: true
    # Act: checking a stopped service must not restart it.
    - name: Check integrity and freshness of the valid stopped deployment
      ansible.builtin.include_role:
        name: hermes_backup
        tasks_from: check
    # Arrange: damage only a separate disposable repository copy.
    - name: Copy the encrypted repository for corruption detection
      ansible.builtin.copy:
        src: "{{ hermes_backup_repository }}/"
        dest: /var/lib/hermes-backup-test/corrupt-repository/
        remote_src: true
        mode: preserve
        directory_mode: "0700"
    - name: Find an encrypted pack in the disposable copy
      ansible.builtin.find:
        paths: /var/lib/hermes-backup-test/corrupt-repository/data
        recurse: true
        file_type: file
      register: corrupt_fixture_packs
    - name: Damage an encrypted data pack without touching the original
      ansible.builtin.command:
        argv:
          [
            truncate,
            --size,
            "0",
            "{{ (corrupt_fixture_packs.files | sort(attribute='path'))[0].path }}",
          ]
      changed_when: true

- name: Verify corrupt-backup rejection
  hosts: localhost
  gather_facts: false
  tasks:
    # Act and Assert
    - name: Reject corrupt encrypted data before reporting freshness
      ansible.builtin.include_tasks: helpers/expect-backup-rejection.yml
      vars:
        backup_rejection_cases:
          - playbook: hermes-backup-check
            variables:
              hermes_backup_repository: /var/lib/hermes-backup-test/corrupt-repository
            message: Authenticate and verify the encrypted repository
    - name: Remove the temporary inventory
      ansible.builtin.file:
        path: "{{ backup_test_inventory.path }}"
        state: absent

- name: Verify checks preserve state and export the verified original repository
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Inspect the source after successful and failed backup checks
      community.docker.docker_container_info:
        name: "{{ hermes_project_name }}-hermes-1"
      register: checked_source
    - name: Require checks to preserve the stopped container and restart policy
      ansible.builtin.assert:
        that:
          - checked_source.container.Id == preserved_source.container.Id
          - not checked_source.container.State.Running
          - checked_source.container.HostConfig.RestartPolicy.Name == 'no'
        quiet: true
    - name: Read snapshots after checks
      ansible.builtin.command:
        argv: [restic, --no-cache, snapshots, --json]
      environment: *fixture-restic-environment
      changed_when: false
      no_log: true
      register: checked_snapshots
    - name: Require checks to preserve every recovery point
      ansible.builtin.assert:
        that:
          - checked_ids | sort == expected_ids | sort
        quiet: true
      vars:
        checked_ids: "{{ checked_snapshots.stdout | from_json | map(attribute='id') | list }}"
        expected_ids: "{{ preserved_snapshots.stdout | from_json | map(attribute='id') | reject('equalto', future_snapshot) | list }}"
    # Arrange
    - name: Allocate a protected encrypted-repository transport file
      ansible.builtin.file:
        path: /var/lib/hermes-backup-test/repository.tar
        state: touch
        owner: root
        group: root
        mode: "0600"
    - name: Pack only the quiescent encrypted repository
      ansible.builtin.command:
        argv:
          [
            tar,
            --create,
            --file,
            /var/lib/hermes-backup-test/repository.tar,
            --directory,
            "{{ hermes_backup_repository }}",
            .,
          ]
      changed_when: true
    - name: Fetch the encrypted copy with checksum verification
      ansible.builtin.fetch:
        src: /var/lib/hermes-backup-test/repository.tar
        dest: "{{ hostvars.localhost.recovery_directory }}/repository.tar"
        flat: true
    - name: Restrict the runner copy
      ansible.builtin.file:
        path: "{{ hostvars.localhost.recovery_directory }}/repository.tar"
        mode: "0600"
      delegate_to: localhost
      become: false
    - name: Read the source host identity
      ansible.builtin.slurp:
        src: /etc/machine-id
      register: source_machine_id
    - name: Record the selected snapshot and source host identity separately
      ansible.builtin.copy:
        dest: "{{ hostvars.localhost.recovery_directory }}/snapshot.yml"
        mode: "0600"
        content: >-
          {{ {'hermes_restore_snapshot': hermes_backup_snapshot,
              'source_machine_id': source_machine_id.content | b64decode | trim} | to_nice_yaml }}
      delegate_to: localhost
      become: false
# Act: the workflow destroys the entire source VM before creating a recovery host.
