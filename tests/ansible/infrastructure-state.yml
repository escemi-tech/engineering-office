---
- name: Qualify independent encrypted infrastructure state
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    infrastructure_state_endpoint: "{{ lookup('ansible.builtin.env', 'STATE_FIXTURE_ENDPOINT') | default('http://127.0.0.1:18333', true) }}"
    infrastructure_state_region: us-east-1
    fixture_password: synthetic-state-password-held-outside-the-managed-host # checkov:skip=CKV_SECRET_6:Public synthetic encryption fixture
  tasks:
    # Arrange: real S3 service, public synthetic credentials and native OpenTofu.
    - name: Install the pinned SDK in the disposable controller environment
      ansible.builtin.pip:
        requirements: "{{ playbook_dir }}/../../ansible/requirements.txt"
        executable: "{{ ansible_playbook_python | dirname }}/pip"
    - name: Allocate an isolated operator checkout
      ansible.builtin.tempfile:
        state: directory
        prefix: engineering-office-state-
      register: state_fixture
    - name: Exercise state bootstrap and recovery
      block:
        - name: Select independent fixture files and workspace
          ansible.builtin.set_fact:
            infrastructure_state_bucket: "engineering-office-state-ci-{{ state_fixture.path | basename | regex_replace('^engineering-office-state-', '') | lower | regex_replace('[^a-z0-9]', 'a') }}"
            infrastructure_state_log_bucket: engineering-office-audit-ci
            infrastructure_state_stack_directory: "{{ state_fixture.path }}/original"
            infrastructure_state_credentials_file: "{{ state_fixture.path }}/credentials"
            infrastructure_state_password_file: "{{ state_fixture.path }}/password"
        - name: Create the source checkout
          ansible.builtin.file:
            path: "{{ infrastructure_state_stack_directory }}"
            state: directory
            mode: "0700"
        - name: Copy the production backend and synthetic resource contract
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ infrastructure_state_stack_directory }}/{{ item | basename }}"
            mode: "0600"
          loop:
            - "{{ playbook_dir }}/../../tofu/professional-host/state.tofu"
            - "{{ playbook_dir }}/../infrastructure-state/contract.tofu"
        - name: Supply a separately recoverable fixture password
          ansible.builtin.copy:
            dest: "{{ infrastructure_state_password_file }}"
            content: "{{ fixture_password }}"
            mode: "0600"
          no_log: true
        - name: Supply the dedicated fixture identity
          ansible.builtin.copy:
            dest: "{{ infrastructure_state_credentials_file }}"
            mode: "0600"
            content: |
              [default]
              aws_access_key_id = synthetic-backup-key
              aws_secret_access_key = test
          no_log: true
        # Act
        - name: Preview bootstrap through native check mode
          ansible.builtin.include_role:
            name: infrastructure_state
            apply:
              check_mode: true
        # Assert
        - name: Inspect the destination after preview
          amazon.aws.s3_bucket_info:
            name: "{{ infrastructure_state_bucket }}"
            endpoint_url: "{{ infrastructure_state_endpoint }}"
            region: "{{ infrastructure_state_region }}"
            profile: default
          environment: "{{ infrastructure_state_environment }}"
          register: preview_bucket
          no_log: true
        - name: Require preview to leave storage absent
          ansible.builtin.assert:
            that: preview_bucket.buckets | length == 0
            quiet: true
        # Act
        - name: Bootstrap through the production role
          ansible.builtin.include_role:
            name: infrastructure_state
        - name: Repeat bootstrap without replacing state storage
          ansible.builtin.include_role:
            name: infrastructure_state
        # Assert
        - name: Require bucket convergence
          ansible.builtin.assert:
            that:
              - not infrastructure_state_storage.changed
            quiet: true
        - name: Exercise native state operations with the configured identity
          ansible.builtin.include_tasks: helpers/infrastructure-state-lifecycle.yml
          args:
            apply:
              environment: "{{ infrastructure_state_environment }}"
              module_defaults:
                amazon.aws.s3_bucket: &fixture-s3
                  endpoint_url: "{{ infrastructure_state_endpoint }}"
                  region: "{{ infrastructure_state_region }}"
                  profile: default
                amazon.aws.s3_bucket_info: *fixture-s3
                amazon.aws.s3_object: *fixture-s3
      rescue:
        - name: Report the failed contract without publishing credentials
          ansible.builtin.fail:
            msg: "Infrastructure state qualification failed at: {{ ansible_failed_task.name }}."
      always:
        - name: Remove only the disposable operator files
          ansible.builtin.file:
            path: "{{ state_fixture.path }}"
            state: absent
