---
# Arrange: the workflow has already destroyed the source VM and created a new one.
- name: Prepare and verify the fresh recovery host
  ansible.builtin.import_playbook: hermes-host.yml

- name: Load only the runner's recovery record and public fixture settings
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Select the synthetic recovery settings
      ansible.builtin.include_tasks: helpers/recovery-settings.yml
    - name: Read the selected snapshot record
      ansible.builtin.include_vars:
        file: "{{ recovery_directory }}/snapshot.yml"
        name: recovery_record
    - name: Select the recorded immutable snapshot on the new host
      ansible.builtin.add_host:
        name: "{{ lookup('ansible.builtin.env', 'VM_NAME') }}"
        hermes_restore_snapshot: "{{ recovery_record.hermes_restore_snapshot }}"

- name: Verify host independence and supply the retained encrypted copy
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Read the recovery host identity
      ansible.builtin.slurp:
        src: /etc/machine-id
      register: recovery_machine_id
    - name: Inspect for inherited deployment assets and recovery files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/srv/engineering-office, /var/lib/hermes-backup-test]
      register: inherited_state
    - name: Require a different host without source deployment or recovery material
      ansible.builtin.assert:
        that:
          - recovery_machine_id.content | b64decode | trim != hostvars.localhost.recovery_record.source_machine_id
          - inherited_state.results | selectattr('stat.exists') | list | length == 0
        quiet: true
    # Arrange
    - name: Supply the fixture key independently of the lost host
      ansible.builtin.include_tasks: helpers/recovery-material.yml
    - name: Transfer and unpack the preserved encrypted repository
      ansible.builtin.unarchive:
        src: "{{ hostvars.localhost.recovery_directory }}/repository.tar"
        dest: "{{ hermes_backup_repository }}"
        owner: root
        group: root
        mode: "u=rwX,go="

# Act: full Restic integrity and file checks are owned by the production entrypoint.
- name: Restore the selected snapshot through the public entrypoint
  ansible.builtin.import_playbook: ../../ansible/hermes-restore.yml

- name: Verify recovery remains inactive
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    # Assert
    - name: Inspect the runtime before explicit deployment
      community.docker.docker_container_info:
        name: "{{ hermes_project_name }}-hermes-1"
      register: inactive_recovery
    - name: Require restoration not to activate Hermes
      ansible.builtin.assert:
        that:
          - not inactive_recovery.exists
        quiet: true

# Act: deploy reviewed assets and synthetic credentials without an inference sidecar.
- name: Deploy the recovered runtime
  ansible.builtin.import_playbook: ../../ansible/hermes.yml
# Assert: Goss reads the original conversation without making a new model request.
