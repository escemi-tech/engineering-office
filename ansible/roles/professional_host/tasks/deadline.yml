---
- name: Read the actual UTC time before a paid operation
  ansible.builtin.command:
    argv: [date, -u, "+%Y-%m-%dT%H:%M:%SZ"]
  changed_when: false
  check_mode: false
  register: professional_host_clock

- name: Require a future qualification expiry within two hours
  ansible.builtin.assert:
    that:
      - (professional_host.qualification.expires_at | to_datetime('%Y-%m-%dT%H:%M:%SZ') - professional_host_clock.stdout | to_datetime('%Y-%m-%dT%H:%M:%SZ')).total_seconds() > 0
      - (professional_host.qualification.expires_at | to_datetime('%Y-%m-%dT%H:%M:%SZ') - professional_host_clock.stdout | to_datetime('%Y-%m-%dT%H:%M:%SZ')).total_seconds() <= 7200
    fail_msg: The fixed qualification deadline must be in the next two hours; do not extend an existing run to create a new allowance.
    quiet: true
