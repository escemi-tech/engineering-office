---
- name: Require exclusive deployment maintenance
  ansible.builtin.include_tasks: "{{ role_path }}/../../helpers/hermes-backup-idle.yml"

- name: Validate deployment inputs before changing the host
  block:
    - name: Validate the explicit runtime credential allowlist
      ansible.builtin.assert:
        that:
          - hermes_project_name is match('^[a-z0-9][a-z0-9_-]+$')
          - hermes_runtime is defined
          - hermes_runtime is mapping
          - hermes_runtime.keys() | sort == ['gateway_api_key', 'inference_api_key', 'inference_url', 'model']
          - hermes_runtime.values() | select('string') | list | length == 4
          - hermes_runtime.values() | select('search', '[\x00-\x1f\x7f]') | list | length == 0
          - hermes_runtime.gateway_api_key | length >= 32
          - hermes_runtime.inference_api_key | trim | length > 0
          - hermes_runtime.model | trim | length > 0
          - hermes_runtime.gateway_api_key != hermes_runtime.inference_api_key
          - hermes_runtime.inference_url | urlsplit('hostname') | default('', true) | length > 0
          - >-
            hermes_runtime.inference_url | urlsplit('scheme') == 'https' or
            (hermes_runtime.inference_url | urlsplit('scheme') == 'http' and
            hermes_runtime.inference_url | urlsplit('hostname') in ['localhost', '127.0.0.1', '::1'])
          - not hermes_runtime.inference_url | urlsplit('username')
          - not hermes_runtime.inference_url | urlsplit('password')
          - not hermes_runtime.inference_url | urlsplit('query')
          - not hermes_runtime.inference_url | urlsplit('fragment')
          - hermes_runtime.inference_url | urlsplit('path') is search('/v1$')
        quiet: true
      no_log: true
  rescue:
    - name: Reject invalid Hermes deployment inputs
      ansible.builtin.fail:
        msg: >-
          Supply exactly model, inference_url, inference_api_key and gateway_api_key
          in hermes_runtime. Use nonempty single-line strings, a distinct gateway key
          of at least 32 characters, and an HTTPS endpoint ending in /v1 without
          embedded credentials, query or fragment. HTTP is allowed only on loopback.
          See docs/usage/hermes-deployment.md.

- name: Require a compiled writing policy on the controller
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.file', role_path ~ '/../../../.build/hermes/AGENTS.md') | length > 0
    fail_msg: Run make hermes-policy on the controller before deployment.
    quiet: true

- name: Create deployment directories owned by the operator
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /srv/engineering-office
    - /srv/engineering-office/services
    - /srv/engineering-office/services/hermes
    - /srv/engineering-office/.build
    - /srv/engineering-office/.build/hermes

- name: Restrict the runtime credential directory
  ansible.builtin.file:
    path: /srv/engineering-office/.local
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deliver only the runtime settings in a protected file
  ansible.builtin.template:
    src: runtime-credentials.j2
    dest: /srv/engineering-office/.local/hermes.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Deliver the reviewed runtime and compiled policy
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../{{ item }}"
    dest: "/srv/engineering-office/{{ item }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - services/hermes/compose.yml
    - services/hermes/config.yaml
    - .build/hermes/AGENTS.md
  register: hermes_assets

- name: Deliver the independent shutdown command
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../Makefile"
    dest: /srv/engineering-office/Makefile
    owner: root
    group: root
    mode: "0444"

- name: Converge Hermes with only its own credentials
  community.docker.docker_compose_v2:
    docker_host: unix:///var/run/docker.sock
    project_src: /srv/engineering-office/services/hermes
    project_name: "{{ hermes_project_name }}"
    files: [compose.yml]
    env_files: [/srv/engineering-office/.local/hermes.env]
    state: present
    recreate: "{{ 'always' if hermes_assets.changed else 'auto' }}"
    wait: true
    wait_timeout: 180
  no_log: true
  register: hermes_deployment
